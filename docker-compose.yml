version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Puerto 8000 solo accesible internamente (nginx del frontend hace proxy)
    # ports:
    #  - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./backend/media:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=False
