version: '3.8'

# Solo el frontend — el backend corre como app separada en Dokploy.
# nginx hace proxy a BACKEND_URL (configurar en Dokploy → Environment).

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
    ports:
      - "80:80"
    restart: unless-stopped
