server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El sitio es un unico HTML que se reemplaza entero en cada publicacion.
    # Sin esta cabecera cada navegador decide por su cuenta cuanto guardarselo,
    # y los visitantes se quedan viendo la version anterior sin enterarse de
    # que hay una nueva. "no-cache" no prohibe guardar: obliga a preguntar
    # antes de usar la copia. Si el archivo no cambio, nginx contesta 304 con
    # el ETag y no se transfieren los tres megas; si cambio, baja el nuevo.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
