<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080F"/>
      <stop offset="100%" stop-color="#0D0F20"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4DD4FF"/>
      <stop offset="50%" stop-color="#7C5BFF"/>
      <stop offset="100%" stop-color="#C84BE0"/>
    </linearGradient>
    <linearGradient id="bubble-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DD4FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C5BFF" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow-l" cx="25%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#7C5BFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#07080F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-r" cx="78%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#4DD4FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#07080F" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-md">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="right-clip">
      <rect x="490" y="0" width="470" height="260" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="960" height="260" fill="url(#bg-grad)"/>
  <rect width="960" height="260" fill="url(#glow-l)"/>
  <rect width="960" height="260" fill="url(#glow-r)"/>

  <!-- Subtle grid — left half only -->
  <g stroke="#7C5BFF" stroke-width="0.35" opacity="0.06">
    <line x1="0" y1="52" x2="480" y2="52"/>
    <line x1="0" y1="104" x2="480" y2="104"/>
    <line x1="0" y1="156" x2="480" y2="156"/>
    <line x1="0" y1="208" x2="480" y2="208"/>
    <line x1="60"  y1="0" x2="60"  y2="260"/>
    <line x1="120" y1="0" x2="120" y2="260"/>
    <line x1="180" y1="0" x2="180" y2="260"/>
    <line x1="240" y1="0" x2="240" y2="260"/>
    <line x1="300" y1="0" x2="300" y2="260"/>
    <line x1="360" y1="0" x2="360" y2="260"/>
    <line x1="420" y1="0" x2="420" y2="260"/>
  </g>

  <!-- Divider line -->
  <line x1="490" y1="24" x2="490" y2="236" stroke="url(#text-grad)" stroke-width="1" opacity="0.25"/>

  <!-- ─── LEFT: Copy ─────────────────────────────────────────────────── -->

  <!-- Eyebrow pill -->
  <rect x="44" y="32" width="196" height="22" rx="11" fill="#11142A" stroke="#2A3060" stroke-width="1"/>
  <circle cx="62" cy="43" r="4" fill="#4ade80" opacity="0.9" filter="url(#glow-soft)"/>
  <text x="74" y="47.5" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#8E94BD" letter-spacing="1.5">ARKANO-IA · AGENTES IA</text>

  <!-- Headline line 1 -->
  <text x="44" y="98" font-family="Space Grotesk, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">Tu equipo</text>

  <!-- Headline line 2 — gradient -->
  <text x="44" y="148" font-family="Space Grotesk, sans-serif" font-size="42" font-weight="700" fill="url(#text-grad)">nunca duerme.</text>

  <!-- Sub copy -->
  <text x="44" y="178" font-family="Sora, sans-serif" font-size="13.5" fill="#6B7280">Automatiza ventas, soporte y operaciones con un agente</text>
  <text x="44" y="196" font-family="Sora, sans-serif" font-size="13.5" fill="#6B7280">de IA que trabaja las 24 hrs, los 7 días.</text>

  <!-- Stats row -->
  <!-- Stat 1 -->
  <text x="44"  y="232" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" fill="#4DD4FF" filter="url(#glow-soft)">24/7</text>
  <text x="44"  y="248" font-family="Sora, sans-serif" font-size="10.5" fill="#5C6394">Disponible</text>

  <!-- Dot separator -->
  <circle cx="128" cy="238" r="2" fill="#2A3060"/>

  <!-- Stat 2 -->
  <text x="140" y="232" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" fill="#7C5BFF" filter="url(#glow-soft)">−80%</text>
  <text x="140" y="248" font-family="Sora, sans-serif" font-size="10.5" fill="#5C6394">Carga manual</text>

  <!-- Dot separator -->
  <circle cx="232" cy="238" r="2" fill="#2A3060"/>

  <!-- Stat 3 -->
  <text x="244" y="232" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" fill="#C84BE0" filter="url(#glow-soft)">×3</text>
  <text x="244" y="248" font-family="Sora, sans-serif" font-size="10.5" fill="#5C6394">Más leads calificados</text>

  <!-- ─── RIGHT: Chat mockup ──────────────────────────────────────────── -->
  <g clip-path="url(#right-clip)">

    <!-- Chat window -->
    <rect x="516" y="18" width="388" height="224" rx="14" fill="#0E1023" stroke="#1E2245" stroke-width="1"/>

    <!-- Chat header -->
    <rect x="516" y="18" width="388" height="48" rx="14" fill="#11142A"/>
    <rect x="516" y="48" width="388" height="18" fill="#11142A"/>
    <!-- Avatar circle -->
    <circle cx="546" cy="42" r="14" fill="#07080F" stroke="url(#text-grad)" stroke-width="1.5"/>
    <text x="546" y="47" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700" fill="url(#text-grad)">T</text>
    <circle cx="556" cy="32" r="4" fill="#4ade80" stroke="#0E1023" stroke-width="1.5"/>
    <!-- Agent name -->
    <text x="568" y="38" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">TRINI</text>
    <text x="568" y="53" font-family="JetBrains Mono, monospace" font-size="9" fill="#4DD4FF" letter-spacing="0.5">Agente de Ventas IA · en línea</text>

    <!-- Divider -->
    <line x1="516" y1="66" x2="904" y2="66" stroke="#1E2245" stroke-width="1"/>

    <!-- Message 1: user -->
    <rect x="690" y="78" width="194" height="36" rx="10" rx="10" fill="url(#bubble-grad)" stroke="#2A3060" stroke-width="0.8"/>
    <text x="702" y="93" font-family="Sora, sans-serif" font-size="10.5" fill="#C8D0F0">Hola, tengo un restaurante</text>
    <text x="702" y="108" font-family="Sora, sans-serif" font-size="10.5" fill="#C8D0F0">y pierdo pedidos de noche</text>
    <text x="878" y="120" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="8" fill="#4B5280">9:41 ✓✓</text>

    <!-- Message 2: TRINI (bot) -->
    <rect x="526" y="124" width="252" height="56" rx="10" fill="#181C36" stroke="#2A3060" stroke-width="0.8"/>
    <text x="538" y="141" font-family="Sora, sans-serif" font-size="10.5" fill="#E2E8F0">¡Entendido! Un agente de IA</text>
    <text x="538" y="157" font-family="Sora, sans-serif" font-size="10.5" fill="#E2E8F0">puede tomar pedidos 24/7 por</text>
    <text x="538" y="172" font-family="Sora, sans-serif" font-size="10.5" fill="#E2E8F0">WhatsApp. ¿Quieres verlo en acción?</text>
    <text x="538" y="185" font-family="JetBrains Mono, monospace" font-size="8" fill="#4DD4FF">9:41</text>

    <!-- Message 3: user -->
    <rect x="740" y="190" width="148" height="24" rx="10" fill="url(#bubble-grad)" stroke="#2A3060" stroke-width="0.8"/>
    <text x="752" y="205" font-family="Sora, sans-serif" font-size="10.5" fill="#C8D0F0">Sí, quiero saber más</text>

    <!-- Typing indicator -->
    <rect x="526" y="222" width="64" height="22" rx="11" fill="#181C36" stroke="#2A3060" stroke-width="0.8"/>
    <circle cx="544" cy="233" r="3" fill="#4DD4FF" opacity="0.9"/>
    <circle cx="556" cy="233" r="3" fill="#7C5BFF" opacity="0.7"/>
    <circle cx="568" cy="233" r="3" fill="#C84BE0" opacity="0.5"/>

    <!-- Input bar -->
    <rect x="516" y="212" width="388" height="30" fill="#0A0C1A" rx="0"/>
    <rect x="516" y="212" width="388" height="30" rx="0" ry="0"/>
    <rect x="516" y="212" width="388" height="1" fill="#1E2245"/>
    <rect x="526" y="220" width="240" height="14" rx="7" fill="#11142A"/>
    <text x="536" y="231" font-family="Sora, sans-serif" font-size="9" fill="#3A4060">Escribe tu pregunta...</text>
    <!-- Send button -->
    <circle cx="882" cy="227" r="11" fill="url(#text-grad)" filter="url(#glow-soft)"/>
    <text x="882" y="231.5" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">➤</text>

    <!-- Bottom corners fix -->
    <rect x="516" y="228" width="388" height="14" rx="0" fill="#0A0C1A"/>
    <rect x="516" y="228" width="388" height="14" rx="14" fill="#0A0C1A"/>
  </g>

  <!-- Border around entire banner -->
  <rect width="960" height="260" rx="18" fill="none" stroke="#1E2245" stroke-width="1.5"/>

  <!-- Top gradient accent line -->
  <rect x="1" y="1" width="958" height="2" rx="1" fill="url(#text-grad)" opacity="0.6"/>
</svg>
